# Lavoro Puglia — scheduler pubblico (solo orchestrazione).
# Il codice della pipeline è nel repository privato bucci200-max/lavoro-puglia-pipeline,
# letto con una deploy key in sola lettura. Repository pubblico = minuti dei
# runner standard gratuiti. I log sono pubblici: la CLI oscura ogni credenziale.
name: Lavoro Puglia pipeline

# Cadenza: ogni ciclo, al termine, avvia il successivo (workflow_dispatch con il token
# del workflow). L'attesa la fa un environment con timer — "cadenza-giorno" 12 min,
# "cadenza-notte" 110 min — senza runner acceso. Il cron di GitHub, che può ritardare o
# saltare esecuzioni, resta solo come rete di sicurezza per riavviare la catena.
on:
  schedule:
    - cron: '7,22,37,52 5-19 * * *'
    - cron: '7 21,23,1,3 * * *'
    # Una volta a settimana mantiene attiva la pianificazione (60 giorni senza attività la disattivano).
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità (vuoto = variabile PIPELINE_MODE). live pubblica su Telegram.'
        type: choice
        options: ['', 'dry-run', 'collect', 'live']
        default: ''
      card_template:
        description: 'Scheda Telegram (vuoto = variabile CARD_TEMPLATE, poi v1)'
        type: choice
        options: ['', 'v1', 'v2']
        default: ''
      pipeline_ref:
        description: 'Ramo del codice pipeline da provare (solo collaudi dry-run)'
        type: string
        default: 'main'
      chained:
        description: 'Uso interno: ciclo avviato dal ciclo precedente'
        type: boolean
        default: false
      cadence:
        description: 'Uso interno: giorno | notte'
        type: string
        default: 'giorno'

permissions:
  contents: read
  actions: write # avviare il ciclo successivo e riattivare la pianificazione
  deployments: write # attesa tramite environment

# I collaudi dry-run (nessuna scrittura, nessun invio) non entrano nella coda dei
# cicli reali, così non possono sostituire o bloccare un anello della catena.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && 'lavoro-puglia-collaudo' || 'lavoro-puglia-pipeline' }}
  cancel-in-progress: false

jobs:
  attesa:
    if: inputs.chained && (vars.PIPELINE_MODE == 'collect' || vars.PIPELINE_MODE == 'live')
    runs-on: ubuntu-24.04
    environment: ${{ inputs.cadence == 'notte' && 'cadenza-notte' || 'cadenza-giorno' }}
    timeout-minutes: 2
    steps:
      - run: echo "Attesa completata, avvio del ciclo"

  pipeline:
    needs: attesa
    # Automatico (cron o catena) solo con PIPELINE_MODE = collect | live; i collaudi si avviano a mano.
    if: >-
      always() && (needs.attesa.result == 'success' || needs.attesa.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && !inputs.chained) ||
       vars.PIPELINE_MODE == 'collect' || vars.PIPELINE_MODE == 'live')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIPELINE_MODE: ${{ inputs.mode || vars.PIPELINE_MODE || 'dry-run' }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.chained }}
      CARD_TEMPLATE: ${{ inputs.card_template || vars.CARD_TEMPLATE || 'v1' }}
    steps:
      - name: Checkout pipeline (privato, deploy key in sola lettura)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bucci200-max/lavoro-puglia-pipeline
          # Rami diversi da main solo nei collaudi dry-run manuali.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && inputs.pipeline_ref) || 'main' }}
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          persist-credentials: false
          path: pipeline

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Dipendenze
        working-directory: pipeline
        run: npm ci --no-audit --no-fund

      - name: Font per le schede (Arial → Liberation Sans)
        run: |
          if ! fc-match Arial | grep -qi liberation; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
          fi
          fc-match Arial

      - name: Stato esecuzioni precedenti
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/.state
          key: run-state-${{ github.run_id }}
          restore-keys: run-state-

      - name: Verifica configurazione e permessi bot (sola lettura, solo avvio manuale)
        if: env.MANUAL == 'true'
        # Diagnostica: un problema Telegram non deve impedire il collaudo della raccolta.
        continue-on-error: true
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
        run: npx tsx functions/cli.ts check

      - name: Pipeline
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          TELEGRAM_PUBLIC_CHANNEL: lavoropuglia26
          PIPELINE_OWNER: github-actions
          # Analisi testuale xKiro: spenta salvo PIPELINE_AI=on (le immagini non usano mai xKiro).
          PIPELINE_AI: ${{ vars.PIPELINE_AI || 'off' }}
          # Avvio manuale: esito rosso a ogni errore. Pianificato: rosso solo quando
          # scatta l'avviso (3 fallimenti consecutivi, poi max 1 al giorno).
          PIPELINE_STRICT: ${{ env.MANUAL }}
        run: npx tsx functions/cli.ts run --budget-seconds 540 --max-publish 6

      - name: Salva stato esecuzioni
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/.state
          key: run-state-${{ github.run_id }}

      - name: Scheda di prova (solo dry-run manuale)
        if: env.MANUAL == 'true' && env.PIPELINE_MODE == 'dry-run' && env.CARD_TEMPLATE != 'v2'
        working-directory: pipeline
        run: npx tsx functions/cli.ts card --out card-preview/scheda-prova.png

      - name: Anteprime banner v2 su offerte reali (sola lettura, solo dry-run manuale)
        if: env.MANUAL == 'true' && env.PIPELINE_MODE == 'dry-run' && env.CARD_TEMPLATE == 'v2'
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/banner-previews.ts --out card-preview

      - name: Pubblica scheda di prova
        if: env.MANUAL == 'true' && env.PIPELINE_MODE == 'dry-run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheda-prova
          path: pipeline/card-preview/
          retention-days: 3

      - name: Mantieni attiva la pianificazione
        if: always() && (vars.PIPELINE_MODE == 'collect' || vars.PIPELINE_MODE == 'live')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"

      # Anche dopo un errore: la catena non deve fermarsi (gli avvisi gestiscono i guasti).
      # Si interrompe impostando PIPELINE_MODE=dry-run. Con la concorrenza, al massimo
      # un ciclo in attesa: un avvio duplicato sostituisce quello pendente.
      - name: Avvia il ciclo successivo
        if: always() && (vars.PIPELINE_MODE == 'collect' || vars.PIPELINE_MODE == 'live') && env.PIPELINE_MODE == vars.PIPELINE_MODE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hour=$(TZ=Europe/Rome date +%H)
          if [ "$hour" -ge 22 ] || [ "$hour" -lt 7 ]; then cadence=notte; else cadence=giorno; fi
          for attempt in 1 2 3; do
            gh workflow run pipeline.yml --repo "${{ github.repository }}" --ref main \
              -f chained=true -f cadence="$cadence" && echo "Prossimo ciclo: $cadence" && exit 0
            sleep $((attempt * 10))
          done
          echo "::warning::Ciclo successivo non avviato: riparte con il cron di riserva"
